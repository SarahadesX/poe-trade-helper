<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE Trade Helper</title>
<style>
  :root{
    --bg:#0d0c0a; --panel:#191612; --panel2:#221d17; --line:#3a3226;
    --gold:#c8aa6e; --gold2:#e8cf95; --text:#ded4c0; --muted:#8f8470;
    --good:#7ec46c; --bad:#d2705f; --blue:#63a9dd;
    --shadow:0 4px 18px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);font:14px/1.55 "Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(1100px 520px at 15% -8%, rgba(200,170,110,.10), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(99,169,221,.07), transparent 55%),
      var(--bg);
    background-attachment:fixed;min-height:100vh}
  a{color:var(--gold2)}
  ::selection{background:rgba(200,170,110,.28)}
  header{padding:14px 24px;display:flex;gap:14px;align-items:center;
    flex-wrap:wrap;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(20,17,13,.97),rgba(20,17,13,.88));
    border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
    box-shadow:0 2px 14px rgba(0,0,0,.35)}
  header h1{font-size:18px;margin:0;letter-spacing:.4px;font-weight:700;
    background:linear-gradient(95deg,#e8cf95,#c8aa6e 60%,#b08d52);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,select,button,textarea{font:inherit;color:var(--text)}
  input[type=text],input[type=number],select{background:#100e0b;
    border:1px solid var(--line);border-radius:8px;padding:9px 12px;
    transition:border-color .15s, box-shadow .15s}
  input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;
    border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,170,110,.13)}
  input[type=text]{flex:1;min-width:280px}
  #league{flex:0 0 auto;min-width:150px;width:190px}
  input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px;
    cursor:pointer}
  button{background:linear-gradient(180deg,#2a2419,#211c14);
    border:1px solid var(--line);color:var(--gold2);border-radius:8px;
    padding:9px 16px;cursor:pointer;font-weight:600;
    transition:transform .12s, border-color .15s, box-shadow .15s, background .15s}
  button:hover{border-color:var(--gold);transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(0,0,0,.4)}
  button:active{transform:translateY(0)}
  button.primary{background:linear-gradient(180deg,#e2c489,#c8aa6e);
    color:#1a140a;border-color:#d8bb7d;box-shadow:0 2px 10px rgba(200,170,110,.2)}
  button.primary:hover{background:linear-gradient(180deg,#f0d69f,#d4b87b);
    box-shadow:0 6px 20px rgba(200,170,110,.3)}
  .tabs{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
  .tab{padding:7px 15px;border:1px solid var(--line);border-radius:20px;
    cursor:pointer;color:var(--muted);background:rgba(255,255,255,.02);
    transition:.15s;font-size:13px}
  .tab:hover{color:var(--text);border-color:#574b39}
  .tab.active{border-color:var(--gold);color:var(--gold2);
    background:linear-gradient(180deg,#2b2115,#231a10);
    box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .modetabs{display:flex;gap:10px;margin:22px 0 4px}
  .modetab{flex:0 0 auto;padding:12px 28px;border:1px solid var(--line);
    border-radius:12px;cursor:pointer;color:var(--muted);font-size:15px;
    font-weight:600;background:linear-gradient(180deg,#1d1a14,#171410);
    transition:transform .12s, border-color .15s, color .15s, box-shadow .15s}
  .modetab:hover{border-color:var(--gold);color:var(--gold2);
    transform:translateY(-2px);box-shadow:var(--shadow)}
  .modetab.active{border-color:#d8bb7d;color:#1a140a;
    background:linear-gradient(180deg,#e2c489,#c8aa6e);
    box-shadow:0 6px 20px rgba(200,170,110,.28)}
  .treerow{display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .treerow:last-child{border-bottom:none}
  .treerow .tt{font-weight:600;color:var(--text)}
  .treerow.active .tt{color:var(--gold2)}
  .treerow .ts{font-size:12px;margin-top:2px}
  .gemgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:10px;margin-top:12px}
  .gemgroup{background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px}
  .gem{padding:3px 0;color:var(--gold2);font-weight:600;display:flex;
    align-items:center;gap:7px}
  .gem.support{color:var(--text);font-weight:400;padding-left:12px;font-size:13px}
  .gemimg{width:26px;height:26px;flex:0 0 auto;border-radius:5px;
    background:#0e0c09;object-fit:contain}
  .gemimg.ph{display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#0e0c09;
    background:linear-gradient(145deg,#c8aa6e,#9a8050);border-radius:5px}
  .gem.support .gemimg{width:20px;height:20px}
  .gem.support .gemimg.ph{font-size:10px;
    background:linear-gradient(145deg,#7d8fa8,#5d6b80)}
  .gemname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .gem.off{opacity:.4;text-decoration:line-through}
  .gbadge{font-size:10px;color:var(--muted);margin-left:5px;
    font-variant-numeric:tabular-nums}
  #setbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
  .setopt{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
    font-size:13px}
  button.mini{padding:5px 12px;font-size:12px}
  .setrow{display:grid;grid-template-columns:140px 1fr 110px auto;gap:12px;
    align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
  .setrow:last-child{border-bottom:none}
  .sr-slot{color:var(--muted);font-size:12px;text-transform:uppercase;
    letter-spacing:.4px}
  .sr-name{color:var(--gold2);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .sr-price{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
  .sr-price b{color:var(--gold2)}
  .setrow.over{background:rgba(201,106,90,.13);border-radius:6px}
  .setrow.over .sr-price b{color:var(--bad)}
  .over-lbl{color:var(--bad);font-size:11px;font-weight:600}
  .totalbox{background:#20180d;border:1px solid var(--gold);border-radius:10px;
    padding:14px 18px;text-align:center}
  .tlabel{color:var(--muted);font-size:13px;text-transform:uppercase;
    letter-spacing:.5px}
  .tbig{color:var(--gold2);font-size:26px;font-weight:700;margin:4px 0}
  .tsub{color:var(--muted);font-size:14px;font-weight:400}
  .tnote{color:var(--muted);font-size:12px;margin-top:3px}
  .advtoggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
    font-size:13px;cursor:pointer}
  .cmp-you{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;color:var(--text);font-size:13px}
  .cmpcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;margin-top:8px}
  .cmphead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .cmpprice{font-weight:700;color:var(--gold2)}
  .cmp-prop{color:var(--muted);font-size:12px}
  .cmpstats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
  .cmp-up{color:var(--good)}
  .cmp-dn{color:var(--bad)}
  .cmp-miss{color:var(--muted)}
  .cmpyou{color:var(--muted);font-size:11px}
  #myGearBtn{padding:8px 14px}
  #myGearBtn.active{background:var(--gold);color:#1a140a;border-color:var(--gold)}
  .howto{background:#1a2230;border:1px solid #33445c;border-radius:8px;
    padding:12px 16px;margin-bottom:14px;color:var(--text);line-height:1.6;
    position:relative;font-size:14px}
  .howtox{position:absolute;top:8px;right:8px;font-size:12px;padding:4px 10px}
  .mghelp{background:#161c28;border:1px solid #2c3a52;border-radius:8px;
    padding:12px 16px;margin:10px 0;color:var(--text);line-height:1.65;
    font-size:14px}
  .mghelp ol{margin:8px 0 2px;padding-left:20px}
  .mghelp li{margin-bottom:7px}
  .mghelp a{color:var(--blue)}
  .mghelp a:hover{color:var(--gold2)}
  .notes{white-space:pre-wrap;word-break:break-word;font:13px/1.6 "Segoe UI",
    system-ui,sans-serif;color:var(--text);background:#0b0a08;border:1px solid
    var(--line);border-radius:6px;padding:14px;max-height:560px;overflow:auto}
  .gembuy{cursor:pointer;color:var(--blue);font-size:11px;margin-left:6px;
    opacity:0;transition:.12s}
  .gemgroup:hover .gembuy{opacity:.85}
  .gembuy:hover{color:var(--gold2)}
  .jewelhead{margin:16px 0 6px;color:var(--gold);font-size:12px;
    text-transform:uppercase;letter-spacing:.5px}
  .opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:12px 0 2px;
    padding:10px 12px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;font-size:13px;color:var(--muted)}
  .opt{display:inline-flex;align-items:center;gap:6px}
  .optin{background:#0b0a08;border:1px solid var(--line);border-radius:5px;
    padding:4px 6px;color:var(--text)}
  .optin:focus{border-color:var(--gold);outline:none}
  .saved{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .saved:empty{margin:0}
  .bchip{display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(180deg,#1f1b15,#191510);
    border:1px solid var(--line);border-radius:20px;padding:5px 8px 5px 13px;
    transition:border-color .15s, box-shadow .15s, transform .12s}
  .bchip:hover{border-color:var(--gold);transform:translateY(-1px);
    box-shadow:0 3px 12px rgba(0,0,0,.35)}
  .bchip .bname{cursor:pointer;color:var(--text);max-width:220px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bchip:hover .bname{color:var(--gold2)}
  .bchip .bx{cursor:pointer;color:var(--text);border:1px solid var(--line);
    background:var(--panel2);width:22px;height:22px;display:inline-flex;
    align-items:center;justify-content:center;font-size:12px;line-height:1;
    border-radius:50%;opacity:.9;padding:0}
  .bchip .bx:hover{opacity:1;border-color:var(--gold);color:var(--gold2)}
  .bchip .bx.del:hover{border-color:var(--bad);color:var(--bad);
    background:rgba(201,106,90,.18)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
    gap:11px;margin-top:12px}
  .slot{background:linear-gradient(180deg,#1e1a14,#171410);
    border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:transform .12s, border-color .15s, box-shadow .15s}
  .slot::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--line);transition:background .15s}
  .slot:hover{border-color:var(--gold);transform:translateY(-2px);
    box-shadow:var(--shadow)}
  .slot:hover::before{background:var(--gold)}
  .slot.r-UNIQUE::before{background:#af6025}
  .slot.r-RARE::before{background:#c9b458}
  .slot.r-MAGIC::before{background:#6a6aff}
  .slot .sn{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px}
  .slotbody{display:flex;gap:9px;align-items:flex-start;margin-top:4px}
  .slotimg{width:38px;height:38px;flex:0 0 auto;object-fit:contain;
    border-radius:5px;background:rgba(0,0,0,.28)}
  .slottext{min-width:0;flex:1}
  .slot .in{color:var(--gold2);font-weight:600}
  .slot .ib{font-size:12px;color:var(--muted)}
  .r-UNIQUE .in{color:#af6025}
  .r-RARE .in{color:#e6c98a}
  .r-MAGIC .in{color:#8888ff}
  .panel{background:linear-gradient(180deg,#1c1913,#171410);
    border:1px solid var(--line);border-radius:12px;padding:18px;
    margin-top:20px;box-shadow:var(--shadow)}
  .modline{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;
    border-radius:7px;transition:background .12s}
  .modline:hover{background:rgba(255,255,255,.035)}
  .modline.no{opacity:.55}
  .modline .modcheck{margin-top:4px}
  .modline .mtxt{flex:1}
  .minwrap{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto}
  .mininput{width:74px;background:#0b0a08;border:1px solid var(--line);
    border-radius:5px;padding:4px 6px;color:var(--blue);
    font-variant-numeric:tabular-nums}
  .mininput:focus{border-color:var(--gold);outline:none}
  .tag{font-size:10px;padding:1px 6px;border-radius:10px;margin-left:6px}
  .tag.ok{background:#1e2e19;color:var(--good);border:1px solid #33512a}
  .tag.miss{background:#2e1c19;color:var(--bad);border:1px solid #512f2a}
  .val{color:var(--blue);font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .err{color:var(--bad)}
  .ok{color:var(--good)}
  pre{background:#0b0a08;border:1px solid var(--line);border-radius:6px;
    padding:10px;overflow:auto;font-size:12px;color:#b9ad93;max-height:240px}
  .hide{display:none}
  .spin{color:var(--muted)}
  details summary{cursor:pointer;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>⚔ PoE Trade Helper</h1>
  <span class="muted">Path of Building → literal-stat trade search</span>
  <span style="flex:1"></span>
  <label class="muted">League</label>
  <input id="league" list="leagueList" placeholder="League" autocomplete="off"
    title="Pick from the list or type the exact league name">
  <datalist id="leagueList"></datalist>
  <label class="advtoggle" title="Show live listings and compare them to your item, inside this app"><input type="checkbox" id="advChk" onchange="setAdv(this.checked)"> Advanced</label>
  <button id="myGearBtn" onclick="toggleMyGear()">👤 My Gear</button>
</header>

<div class="wrap">
  <div id="howto" class="howto hide">
    <b>New here?</b> 1) Paste a build link and hit <b>Load build</b>.
    2) Pick <b>Gear</b>, <b>Skill Tree</b>, <b>Gems</b> or <b>Guide</b>.
    3) Click an item, then <b>Search</b> to buy it — or <b>Search whole set</b> for prices on everything.
    <button class="howtox" onclick="dismissHowto()">Got it ✕</button>
  </div>
  <div class="row">
    <input id="link" type="text" placeholder="Paste a maxroll.gg / mobalytics.gg build, pobb.in / pastebin link, or raw PoB code…">
    <button class="primary" id="loadBtn">Load build</button>
  </div>
  <div id="loadMsg" class="muted" style="margin-top:8px"></div>

  <div id="saved" class="saved"></div>

  <div id="modeTabs" class="modetabs hide"></div>

  <div id="gearPanel" class="hide">
    <div id="tabs" class="tabs"></div>
    <div id="setbar"></div>
    <div id="setResults" class="hide"></div>
    <div id="slots" class="grid"></div>
    <div id="jewels"></div>
  </div>

  <div id="treePanel" class="hide"></div>
  <div id="gemPanel" class="hide"></div>
  <div id="notesPanel" class="hide"></div>
  <div id="myPanel" class="hide"></div>
  <div id="detail" class="panel hide"></div>
</div>

<script>
let BUILD=null, curSet=0, curItem=null;
let BUDGET='', CURRENCY='divine';   // remembered across searches
let SETJEWELS=true, SETFLASKS=false, SET_URLS=[];

async function api(path, body, timeoutMs){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeoutMs||60000);
  try{
    const r = await fetch(path, {method:body?'POST':'GET',
      headers:{'Content-Type':'application/json'},
      body: body?JSON.stringify(body):undefined, signal:ctrl.signal});
    return await r.json();
  } finally { clearTimeout(t); }
}

async function initLeagues(){
  const inp = document.getElementById('league');
  try{
    const d = await api('/api/leagues');
    document.getElementById('leagueList').innerHTML =
      (d.leagues||[]).map(l=>`<option value="${esc(l)}">`).join('');
    if(!inp.value) inp.value = d.current || (d.leagues&&d.leagues[0]) || 'Standard';
  }catch(e){ if(!inp.value) inp.value='Standard'; }
}

document.getElementById('loadBtn').onclick = load;
document.getElementById('link').addEventListener('keydown',e=>{if(e.key==='Enter')load();});

async function load(){
  const link = document.getElementById('link').value.trim();
  const msg = document.getElementById('loadMsg');
  if(!link){msg.textContent='Paste a PoB link or code first.';return;}
  MYVIEW=false; document.getElementById('myGearBtn').classList.remove('active');
  ['modeTabs','gearPanel','treePanel','gemPanel','notesPanel','myPanel','detail']
    .forEach(id=>document.getElementById(id).classList.add('hide'));
  document.getElementById('slots').innerHTML='';
  const t0=Date.now();
  const tick=setInterval(()=>{
    msg.innerHTML='<span class="spin">Loading build… '+Math.round((Date.now()-t0)/1000)+'s</span>';
  },200);
  let d;
  try{
    d = await api('/api/load',{link}, 90000);
  }catch(e){
    clearInterval(tick);
    msg.innerHTML='<span class="err">Timed out or network error'+
      (e&&e.name==='AbortError'?' (90s)':'')+'. maxroll/PoE may be slow — try again. '+
      'Details in logs/errors.log.</span>';
    return;
  }
  clearInterval(tick);
  if(!d || d.error){msg.innerHTML='<span class="err">'+esc((d&&d.error)||'No response')+'</span>';return;}
  BUILD=d; curSet=0; curItem=null; MODE=null; curGemSet=null; GEMICONS={};
  ITEMICONS={};
  msg.innerHTML='<span class="ok">Loaded in '+((Date.now()-t0)/1000).toFixed(1)+'s.</span> '+
    '<span class="muted">Choose Gear, Skill Tree or Gems below.</span>';
  renderTabs(); renderSlots(); renderJewels(); renderSetbar();
  showModeTabs(); renderMode();
  loadItemIcons();
  saveBuild(link);          // remember this build in the saved list
}

// ---- Top-level Gear / Skill Tree tabs (content hidden until you pick one) ---
let MODE=null;   // null | 'gear' | 'tree' | 'gems'
let curGemSet=null;
function showModeTabs(){
  const mt=document.getElementById('modeTabs');
  if(!BUILD){ mt.classList.add('hide'); mt.innerHTML=''; return; }
  mt.classList.remove('hide');
  const nT=(BUILD.trees||[]).length, nG=(BUILD.skills||[]).length;
  mt.innerHTML=
    `<div class="modetab${MODE==='gear'?' active':''}" onclick="setMode('gear')">🛡 Gear</div>`+
    `<div class="modetab${MODE==='tree'?' active':''}" onclick="setMode('tree')">🌳 Skill Tree${nT?' ('+nT+')':''}</div>`+
    `<div class="modetab${MODE==='gems'?' active':''}" onclick="setMode('gems')">🔮 Gems${nG?' ('+nG+')':''}</div>`+
    (BUILD.notes?`<div class="modetab${MODE==='notes'?' active':''}" onclick="setMode('notes')">📖 Guide</div>`:'');
}
function setMode(m){ MODE = (MODE===m ? null : m); showModeTabs(); renderMode(); }
function renderMode(){
  document.getElementById('gearPanel').classList.toggle('hide', MODE!=='gear');
  document.getElementById('treePanel').classList.toggle('hide', MODE!=='tree');
  document.getElementById('gemPanel').classList.toggle('hide', MODE!=='gems');
  document.getElementById('notesPanel').classList.toggle('hide', MODE!=='notes');
  document.getElementById('detail').classList.add('hide');
  if(MODE==='tree') renderTrees();
  if(MODE==='gems'){ renderGems(); loadGemIcons(); }
  if(MODE==='notes') renderNotes();
}
function renderNotes(){
  const el=document.getElementById('notesPanel');
  const n=(BUILD&&BUILD.notes)||'';
  el.innerHTML='<div class="panel"><div class="muted" style="margin-bottom:8px">'+
    'The build author\'s notes — leveling order and how to play:</div>'+
    '<pre class="notes">'+esc(n)+'</pre></div>';
}
function pickGemSet(i){ curGemSet=i; renderGems(); }
// Gem icons are fetched from the trade site once and cached server-side.
let GEMICONS={}, GEMFETCHING=false;
async function loadGemIcons(){
  if(GEMFETCHING || !BUILD || !BUILD.skills) return;
  const names=[], supports={};
  for(const set of BUILD.skills)
    for(const g of set.groups)
      for(const gm of g.gems)
        if(gm.name && !GEMICONS[gm.name]){ names.push(gm.name); supports[gm.name]=!!gm.support; }
  if(!names.length) return;
  GEMFETCHING=true;
  const want=[...new Set(names)];
  try{
    // The server fetches uncached icons in small throttled batches, so keep
    // asking until they've all filled in (cached ones return instantly).
    let pending=want.slice();
    for(let round=0; round<6 && pending.length; round++){
      const batch=pending.slice(0,14);
      const d=await api('/api/gemicons',{names:batch, supports,
        league:document.getElementById('league').value}, 90000);
      const got=(d&&d.icons)||{};
      let added=0;
      for(const [k,v] of Object.entries(got)){ if(v && !GEMICONS[k]){ GEMICONS[k]=v; added++; } }
      // Drop this batch either way: resolved ones are cached, the rest have no
      // art we can find (they show a lettered placeholder instead).
      pending=pending.slice(batch.length);
      if(added && MODE==='gems') renderGems();
    }
  }catch(e){}
  GEMFETCHING=false;
}
function renderGems(){
  const el=document.getElementById('gemPanel');
  const sets=(BUILD&&BUILD.skills)||[];
  if(!sets.length){ el.innerHTML='<div class="panel muted">This build has no skill gems.</div>'; return; }
  if(curGemSet===null){ const a=sets.findIndex(s=>s.active); curGemSet=a<0?0:a; }
  if(curGemSet>=sets.length) curGemSet=0;
  const setTabs = sets.length>1
    ? '<div class="tabs">'+sets.map((s,i)=>`<div class="tab${i===curGemSet?' active':''}" onclick="pickGemSet(${i})">${esc(s.title)}${s.active?' ★':''}</div>`).join('')+'</div>'
    : '';
  const groups = sets[curGemSet].groups.map(g=>{
    const gems=g.gems.map(gm=>{
      const badge=(gm.level?` <span class="gbadge">L${gm.level}</span>`:'')+
                  (gm.quality?` <span class="gbadge">Q${gm.quality}</span>`:'');
      const cls='gem'+(gm.support?' support':'')+(gm.enabled?'':' off');
      const ic=GEMICONS[gm.name];
      // Colour the placeholder by gem colour (red/green/blue) so the list still
      // reads at a glance for gems whose art we couldn't resolve.
      const img=ic?`<img class="gemimg" src="${esc(ic)}" alt="" loading="lazy">`
                 :`<span class="gemimg ph">${esc((gm.name||'?').charAt(0))}</span>`;
      return `<div class="${cls}">${img}<span class="gemname">${esc(gm.name)}${badge}</span>`+
             `<a class="gembuy" data-n="${esc(gm.name)}" data-s="${gm.support?1:0}" onclick="buyGem(this.dataset.n,this.dataset.s==='1')">buy ↗</a></div>`;
    }).join('');
    return `<div class="gemgroup">${gems}</div>`;
  }).join('');
  el.innerHTML='<div class="panel">'+setTabs+
    '<div class="muted" style="margin:2px 0 2px">Active skills in gold, support gems below each:</div>'+
    '<div class="gemgroups">'+groups+'</div></div>';
}
function renderTrees(){
  const el=document.getElementById('treePanel');
  const trees=(BUILD&&BUILD.trees)||[];
  if(!trees.length){ el.innerHTML='<div class="panel muted">This build has no saved passive trees.</div>'; return; }
  el.innerHTML='<div class="panel"><div class="muted" style="margin-bottom:8px">'+
    'Passive trees (usually one per level / stage). Click to open the full interactive tree on pathofexile.com:</div>'+
    trees.map(t=>`<div class="treerow${t.active?' active':''}">
      <div><div class="tt">${esc(t.title)}${t.active?' <span class="tag ok">active</span>':''}</div>
        <div class="ts muted">${t.nodes} passives · tree ${esc(t.version)}${t.class?' · '+esc(t.class):''}</div></div>
      ${t.url?`<a href="${esc(t.url)}" target="_blank"><button class="primary">View tree ↗</button></a>`
             :'<span class="muted">no link</span>'}
    </div>`).join('')+'</div>';
}

async function buyGem(name, support){
  let type=name;
  if(support && !/ Support$/i.test(name)) type=name+' Support';
  try{
    const d=await api('/api/search',{item:{base:type,name:'',rarity:'GEM'},mods:[],
      league:document.getElementById('league').value});
    if(d && d.url) window.open(d.url,'_blank');
    else alert('Could not open gem search: '+((d&&d.error)||''));
  }catch(e){ alert('Could not open gem search.'); }
}

async function loadMyGear(){
  const account=(document.getElementById('mgAcc')||{}).value.trim();
  const character=(document.getElementById('mgChar')||{}).value.trim();
  const grid=document.getElementById('myGearGrid');
  if(!account||!character){ grid.innerHTML='<span class="err">Type your account name and character name first.</span>'; return; }
  try{ localStorage.setItem('poe_account',account); localStorage.setItem('poe_char',character); }catch(e){}
  grid.innerHTML='<span class="spin">Loading your gear…</span>';
  let d; try{ d=await api('/api/mygear',{account,character},30000); }catch(e){ d={error:'Failed to load. Try again.'}; }

// Item/jewel base-type art (same RePoE map as gems: instant, no rate limits).
let ITEMICONS={};
async function loadItemIcons(){
  if(!BUILD) return;
  const bases=[];
  const add=s=>{ if(s.base && !(s.base in ITEMICONS)) bases.push(s.base); };
  for(const set of (BUILD.item_sets||[])) set.slots.forEach(add);
  (BUILD.jewels||[]).forEach(add);
  (MYGEAR||[]).forEach(add);
  if(!bases.length) return;
  try{
    const d=await api('/api/itemicons',{bases:[...new Set(bases)]}, 30000);
    let got=false;
    for(const b of new Set(bases)) ITEMICONS[b]=((d&&d.icons)||{})[b]||null, got=true;
    if(got){ renderSlots(); renderJewels(); if(MYVIEW) renderMyGearGrid(); }
  }catch(e){}
}

// ---- Search whole set: one throttled search per item, links listed in-app --
function renderSetbar(){
  document.getElementById('setbar').innerHTML=
    `<button class="primary" onclick="doSearchSet()">🔍 Search whole set</button>
     <label class="setopt"><input type="checkbox" ${SETJEWELS?'checked':''} onchange="SETJEWELS=this.checked"> tree jewels</label>
     <label class="setopt"><input type="checkbox" ${SETFLASKS?'checked':''} onchange="SETFLASKS=this.checked"> flasks</label>
     <span class="setopt">Budget / item <input type="number" step="any" class="optin" id="setPrice" value="${BUDGET}" placeholder="none" style="width:60px">
       <select class="optin" id="setCur">
         <option value="divine"${CURRENCY==='divine'?' selected':''}>div</option>
         <option value="chaos"${CURRENCY==='chaos'?' selected':''}>chaos</option>
       </select>
       <span class="muted" style="font-size:12px">(pricier items turn red)</span></span>`;
}
function itemToSearch(s){
  return {slot:s.slot, item:{base:s.base,name:s.name,rarity:s.rarity,slot:s.slot},
    mods:s.mods.filter(m=>m.matched).map(m=>({line:m.line,min:m.value})),
    use_name:s.rarity==='UNIQUE'};
}
function gatherSetItems(){
  const items=[];
  for(const s of BUILD.item_sets[curSet].slots){
    if(!SETFLASKS && /flask/i.test(s.slot)) continue;
    items.push(itemToSearch(s));
  }
  if(SETJEWELS) for(const j of (BUILD.jewels||[])) items.push(itemToSearch(j));
  return items;
}
async function doSearchSet(){
  const items=gatherSetItems();
  const el=document.getElementById('setResults'); el.classList.remove('hide');
  if(!items.length){ el.innerHTML='<div class="panel muted">Nothing to search.</div>'; return; }
  BUDGET=(document.getElementById('setPrice')||{}).value||'';
  CURRENCY=(document.getElementById('setCur')||{}).value||'divine';
  const t0=Date.now(), est=Math.ceil(items.length*1.2);
  const tick=setInterval(()=>{
    el.innerHTML='<div class="panel"><span class="spin">Finding each item and checking prices… '+
      Math.round((Date.now()-t0)/1000)+'s of about '+est+'s. Please wait.</span></div>';
  },300);
  let d;
  try{ d=await api('/api/searchset',{items, budget:BUDGET, budget_currency:CURRENCY,
        league:document.getElementById('league').value}, 240000); }
  catch(e){ clearInterval(tick); el.innerHTML='<div class="panel err">Timed out — try again.</div>'; return; }
  clearInterval(tick);
  renderSetResults((d&&d.results)||[], d||{});
}
function fmtPrice(p){
  if(!p) return '<span class="muted">no price</span>';
  const c=p.currency.charAt(0).toUpperCase()+p.currency.slice(1);
  const a=(p.amount%1===0)?p.amount:p.amount.toFixed(1);
  return '<b>'+a+'</b> '+c;
}
function totalText(meta){
  const tc=meta&&meta.total_chaos, dr=meta&&meta.divine_rate;
  if(tc>0 && dr){
    if(tc>=dr) return '<b>'+(tc/dr).toFixed(1)+'</b> Divine <span class="tsub">(about '+Math.round(tc)+' Chaos)</span>';
    return '<b>'+Math.round(tc)+'</b> Chaos';
  }
  // Fallback (no divine rate): show per-currency subtotals.
  const totals=(meta&&meta.totals)||{}, order={divine:0,exalted:1,chaos:2};
  const keys=Object.keys(totals).sort((a,b)=>((order[a]??9)-(order[b]??9)));
  if(!keys.length) return 'No prices found';
  return keys.map(c=>{const v=totals[c]; const amt=(v%1===0)?v:v.toFixed(1);
    return '<b>'+amt+'</b> '+c.charAt(0).toUpperCase()+c.slice(1);}).join('  +  ');
}
function renderSetResults(res, meta){
  SET_URLS=res.filter(r=>r.url).map(r=>r.url);
  const anyOver=res.some(r=>r.over);
  const rows=res.map(r=>`<div class="setrow${r.over?' over':''}">
    <span class="sr-slot">${esc(r.slot)}</span>
    <span class="sr-name">${esc(r.name)}</span>
    <span class="sr-price">${fmtPrice(r.price)}${r.over?' <span class="over-lbl">over budget</span>':''}</span>
    ${r.url?`<a href="${esc(r.url)}" target="_blank"><button class="mini">Buy ↗</button></a>`
           :`<span class="err" title="${esc(r.error||'')}">not found</span>`}
  </div>`).join('');
  document.getElementById('setResults').innerHTML='<div class="panel">'+
    '<div class="totalbox"><div class="tlabel">Rough cost to buy this gear now</div>'+
      '<div class="tbig">≈ '+totalText(meta)+'</div>'+
      (anyOver?'<div class="tnote"><span class="over-lbl">Red</span> = costs more than your budget of '+esc(BUDGET)+' '+esc(CURRENCY)+' — pricey pieces to save up for.</div>':'')+
      '<div class="tnote">Prices change all the time — this is only a guide. Click <b>Buy</b> to see live listings.</div>'+
    '</div>'+
    '<div class="row" style="justify-content:space-between;margin:10px 0 6px">'+
      '<span class="muted">'+SET_URLS.length+' of '+res.length+' found</span>'+
      (SET_URLS.length?'<button class="primary" onclick="openAllSet()">Open all ↗</button>':'')+
    '</div>'+rows+'</div>';
}
function openAllSet(){ SET_URLS.forEach((u,i)=>setTimeout(()=>window.open(u,'_blank'), i*250)); }

function showDetail(){
  const s=curItem;
  const d=document.getElementById('detail');
  d.classList.remove('hide');
  const uniq = s.rarity==='UNIQUE';
  const rows = s.mods.map((m,idx)=>{
    const tag = m.matched? '<span class="tag ok">stat ✓</span>'
                         : '<span class="tag miss">no trade stat</span>';
    // Prefill every min with the PoB value (low end of a range) so you don't
    // have to type it — just raise it if you want a better roll. Clear = any.
    const pre = (m.matched && m.value!==null && m.value!==undefined) ? m.value : '';
    const minBox = m.matched
      ? `<span class="minwrap">min <input type="number" step="any" class="mininput" value="${pre}" placeholder="any"></span>`
      : '';
    return `<label class="modline ${m.matched?'':'no'}">
       <input type="checkbox" class="modcheck" data-line="${esc(m.line)}" ${m.matched?'checked':''} ${m.matched?'':'disabled'}>
       <span class="mtxt">${esc(m.line)} ${tag}</span>
       ${minBox}</label>`;
  }).join('');
  d.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div><div class="sn muted">${esc(s.slot)}</div>
        <div class="in" style="font-size:17px;color:var(--gold2)">${esc(s.name||s.base)}</div>
        <div class="ib muted">${esc(s.base)} · ${esc(s.rarity)}</div></div>
      <button class="primary" onclick="doSearch()">🔍 Search PoE Trade</button>
    </div>
    <div style="margin:14px 0 4px" class="muted">Each <b>min</b> is pre-filled from the build — just hit search, or raise a value for a better roll (clear a box = any):</div>
    <div>${rows||'<span class="muted">No mods.</span>'}</div>
    ${uniq?'<label class="row" style="margin-top:10px"><input type="checkbox" id="useName" checked> match this unique by name</label>':''}
    <div id="searchOut"></div>`;
}

// ---- Advanced mode (show + compare live listings inside the app) -----------
let ADV=false;
function setAdv(on){ ADV=on; try{localStorage.setItem('poe_adv',on?'1':'');}catch(e){} }
function gatherDetailMods(){
  const mods=[];
  for(const row of document.querySelectorAll('#detail .modline')){
    const cb=row.querySelector('.modcheck');
    if(!cb||!cb.checked) continue;
    const mi=row.querySelector('.mininput');
    let min=null;
    if(mi && mi.value.trim()!==''){ const n=parseFloat(mi.value); if(!isNaN(n)) min=n; }
    mods.push({line:cb.dataset.line, min});
  }
  return mods;
}
async function doSearch(){
  const s=curItem;
  const mods=gatherDetailMods();
  const useName = !!(document.getElementById('useName')||{}).checked;
  const league=document.getElementById('league').value;
  const payload={item:{base:s.base,name:s.name,rarity:s.rarity,slot:s.slot},mods,league,use_name:useName};
  const out=document.getElementById('searchOut');
  if(ADV){
    out.innerHTML='<div class="spin" style="margin-top:12px">Searching trade & loading items to compare…</div>';
    let d; try{ d=await api('/api/searchitems',payload,45000); }catch(e){ d={error:'Search timed out — try again.'}; }
    renderCompare(d,s);
    return;
  }
  out.innerHTML='<div class="spin" style="margin-top:12px">Creating trade search…</div>';
  const d=await api('/api/search',payload);
  let h='<div style="margin-top:14px">';
  if(d.url){
    h+=`<div class="ok">✓ Search ready.</div>`;
    if(d.note){ h+=`<div class="muted" style="margin-top:6px">ⓘ ${esc(d.note)}</div>`; }
    h+=`<div style="margin-top:8px"><a href="${d.url}" target="_blank"><button class="primary">Open in PoE Trade ↗</button></a></div>`;
    window.open(d.url,'_blank');
  }else{
    h+=`<div class="err">Couldn't auto-create the search: ${esc(d.error||'')}</div>`;
  }
  if(d.skipped&&d.skipped.length){
    h+='<details><summary>'+d.skipped.length+' mod(s) had no trade stat (skipped)</summary><pre>'+esc(d.skipped.join('\n'))+'</pre></details>';
  }
  h+='</div>';
  out.innerHTML=h;
}
function niceStat(t){ return String(t||'').replace(/^[+-]?\(?\d[\d.,\-–]*\)?%?\s*/,'').replace(/^to /,'').trim(); }
function statNum(v){ return (v%1===0)?v:Math.round(v*10)/10; }
function statAgg(mods){  // sum values per stat id
  const a={};
  for(const m of (mods||[])){
    const id=m.id, v=m.value, text=m.text||m.line;
    if(!id || v===null || v===undefined) continue;
    if(!a[id]) a[id]={value:0,text:text};
    a[id].value+=v;
  }
  return a;
}
function renderCompare(d, myItem){
  const out=document.getElementById('searchOut');
  let h='<div style="margin-top:14px">';
  if(!d || d.error){ out.innerHTML=h+'<div class="err">'+esc((d&&d.error)||'Search failed.')+'</div></div>'; return; }
  h+='<div style="margin-bottom:8px"><a href="'+esc(d.url||'#')+'" target="_blank"><button class="primary">Open full search in PoE Trade ↗</button></a>'+
     (d.note?' <span class="muted">('+esc(d.note)+')</span>':'')+'</div>';
  if(!d.items||!d.items.length){ out.innerHTML=h+'<div class="muted">No live listings found right now.</div></div>'; return; }
  const myAgg=statAgg((myItem.mods||[]).map(m=>({id:m.id,value:m.value,text:m.line})));
  const myIds=Object.keys(myAgg);
  h+='<div class="cmp-you"><b>Your '+esc(myItem.base)+':</b> '+
     (myIds.length? myIds.map(id=>esc(niceStat(myAgg[id].text))+' <b>'+statNum(myAgg[id].value)+'</b>').join(' &middot; ')
                  : 'no comparable stats')+'</div>';
  h+='<div class="muted" style="margin:8px 0 6px">Cheapest matches — <span class="cmp-up">green = same or better</span> than yours, <span class="cmp-dn">red = worse</span>:</div>';
  for(const it of d.items){
    const fa=statAgg(it.mods);
    let ups=0;
    const statsHtml=myIds.map(id=>{
      const yv=myAgg[id].value, fv=(fa[id]?fa[id].value:null);
      if(fv===null) return '<span class="cmp-miss">– '+esc(niceStat(myAgg[id].text))+' —</span>';
      const up=fv>=yv; if(up) ups++;
      return '<span class="'+(up?'cmp-up':'cmp-dn')+'">'+(up?'✓':'✗')+' '+esc(niceStat(myAgg[id].text))+' <b>'+statNum(fv)+'</b> <span class="cmpyou">(you '+statNum(yv)+')</span></span>';
    }).join('');
    const weap=(it.props&&it.props['Physical Damage'])?
      ('<span class="cmp-prop">Phys '+esc(it.props['Physical Damage'])+(it.props['Attacks per Second']?' &middot; '+esc(it.props['Attacks per Second'])+'aps':'')+'</span>'):'';
    const verdict = myIds.length? (ups===myIds.length?'<span class="cmp-up">upgrade ✓</span>':'<span class="muted">'+ups+'/'+myIds.length+' better</span>') : '';
    h+='<div class="cmpcard"><div class="cmphead"><span class="cmpprice">'+fmtPrice(it.price)+'</span>'+
       (it.corrupted?' <span class="over-lbl">corrupted</span>':'')+' '+weap+'<span style="flex:1"></span>'+verdict+'</div>'+
       '<div class="cmpstats">'+(statsHtml||'<span class="muted">no comparable stats</span>')+'</div></div>';
  }
  out.innerHTML=h+'</div>';
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

initLeagues();
loadSaved();
try{ if(!localStorage.getItem('poe_howto_done')) document.getElementById('howto').classList.remove('hide'); }catch(e){}
try{ if(localStorage.getItem('poe_adv')){ ADV=true; document.getElementById('advChk').checked=true; } }catch(e){}

// Keep-alive: while this tab is open, an SSE connection stays open to the
// server. Closing the tab drops it and the server shuts itself down. A reload
// just reconnects (the browser auto-reconnects EventSource), so it survives.
let _keepAlive;
function connectKeepAlive(){
  try{
    _keepAlive = new EventSource('/api/keepalive');
    _keepAlive.onerror = ()=>{};  // browser auto-reconnects
  }catch(e){}
}
connectKeepAlive();
</script>
